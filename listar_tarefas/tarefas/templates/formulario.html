<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo_formulario }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h3 class="mb-0">{{ titulo_formulario }}</h3>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            
                            <!-- Campo Título -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Título</label>
                                <input type="text" name="titulo" class="form-control" value="{{ form.titulo.value|default:'' }}" required>
                                {{ form.titulo.errors }}
                            </div>

                            <!-- Campo Descrição -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Descrição</label>
                                <textarea name="descricao" class="form-control" rows="3">{{ form.descricao.value|default:'' }}</textarea>
                                {{ form.descricao.errors }}
                            </div>

                            <!-- Campo Prioridade -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Prioridade</label>
                                <select name="prioridade" class="form-select" required>
                                    <option value="baixa" {% if form.prioridade.value == 'baixa' %}selected{% endif %}>Baixa</option>
                                    <option value="media" {% if form.prioridade.value == 'media' %}selected{% endif %}>Média</option>
                                    <option value="alta" {% if form.prioridade.value == 'alta' %}selected{% endif %}>Alta</option>
                                </select>
                                {{ form.prioridade.errors }}
                            </div>

                            <!-- Campo Prazo -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Prazo (Opcional)</label>
                                <!-- O value formata a data para o padrão aceito pelo HTML (AAAA-MM-DD) -->
                                <input type="date" name="prazo" class="form-control" value="{{ form.prazo.value|date:'Y-m-d' }}">
                                {{ form.prazo.errors }}
                            </div>

                            <div class="d-flex justify-content-between">
                                <a href="{% url 'lista_tarefas' %}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Salvar Tarefa</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
