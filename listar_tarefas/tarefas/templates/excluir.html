<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Tarefa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-danger shadow">
                    <div class="card-header bg-danger text-white">
                        <h3 class="mb-0">Atenção!</h3>
                    </div>
                    <div class="card-body text-center">
                        <h5 class="mb-4">Tem certeza de que deseja excluir a tarefa abaixo?</h5>
                        <p class="fs-5 text-danger fw-bold">"{{ tarefa.titulo }}"</p>
                        
                        <form method="post" class="mt-4">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger w-100 mb-2">Sim, excluir permanentemente</button>
                        </form>
                        
                        <a href="{% url 'detalhe_tarefa' tarefa.pk %}" class="btn btn-outline-secondary w-100">Cancelar e voltar aos detalhes</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
